<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Stickers</title>
    <link rel="icon" href="images/icon.png" />
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="controls">
        <input type="text" id="taskInput" placeholder="Что делаем?">
        <button id="addBtn">Добавить</button>
    </div>

    <div class="workspace">
        <div class="stickers" id="stickers">
            <button class="clear-btn" data-target="stickers">Очистить</button>
        </div>

        <div class="board" id="board">
            <button class="clear-btn" data-target="board">Очистить</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
